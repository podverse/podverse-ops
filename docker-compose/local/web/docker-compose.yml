networks:
  podverse_local_network:
    external: true

services:

  podverse_local_web:
    image: podverse-web:latest
    container_name: podverse_local_web
    networks:
      - podverse_local_network
    ports:
      - 127.0.0.1:3000:3000
    command: sh -c "npm start"
    logging:
      driver: 'json-file'
      options:
        max-file: '1'
        max-size: '50m'
