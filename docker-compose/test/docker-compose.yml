volumes:
  vhost:
  rabbitmq_data:

networks:
  podverse_sandbox_network:
    external: true

services:
  podverse_test_db:
    image: postgres:16.3
    container_name: podverse_test_db
    env_file:
      - ../../config/podverse-test-db.env
    ports:
      - '5111:5432' # Use port 5111 for the test database so it doesn't conflict with the dev database
    networks:
      - podverse_network
    # to initialize the database with the schema, you can run:
    # docker exec -i podverse_db psql -U user -d postgres -f /opt/database/combined/init_database.sql
    volumes:
      - ../../database/combined/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql
    command: >
      postgres -c max_connections=200
               -c superuser_reserved_connections=20
               -c shared_buffers=2GB
               -c effective_cache_size=6GB
               -c maintenance_work_mem=512MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c random_page_cost=1.1
               -c effective_io_concurrency=200
               -c work_mem=5242kB
               -c min_wal_size=1GB
               -c max_wal_size=2GB
               -c max_worker_processes=4
               -c max_parallel_workers_per_gather=2
               -c max_parallel_workers=4
    restart: always
    shm_size: 1gb
    logging:
      driver: 'json-file'
      options:
        max-file: '1'
        max-size: '50m'