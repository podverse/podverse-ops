# Version: 3
# Defines strict TLS security policies.
# Corresponds to Nginx 'ssl_protocols' and 'ssl_ciphers'.
# UPDATE: Fixed field name from 'strictSNI' to 'sniStrict'.

apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: podverse-secure-tls
  namespace: podverse-alpha
spec:
  minVersion: VersionTLS12 # Enforce TLS 1.2 or higher (1.3 is preferred)
  
  # HSTS (Strict Transport Security) and SNI strictness
  # This must be a direct field of 'spec'
  # CORRECTION: The valid CRD field is 'sniStrict', not 'strictSNI'
  sniStrict: true

  # Optional: Restrict Cipher Suites (Modern Compatibility)
  # If removed, Traefik uses Go's safe defaults (usually sufficient).
  cipherSuites:
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305