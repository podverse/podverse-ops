# Version: 3
# UPDATE: Added writable volume for /var/lib/valkeydb-instance and explicit bash command.

apiVersion: batch/v1
kind: Job
metadata:
  name: podverse-keyvaldb-provisioner
  labels:
    component: provisioner
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  template:
    metadata:
      labels:
        component: provisioner
    spec:
      restartPolicy: OnFailure
      containers:
      - name: provisioner
        image: valkey/valkey
        # RUN WITH BASH EXPLICITLY to avoid "Permission denied" on the script execution
        command: ["/bin/bash", "/opt/keyvaldb/valkey-entrypoint.sh"]
        
        envFrom:
        - secretRef:
            name: podverse-valkeydb-opaque
        
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        # MOUNT WRITABLE DIR: The CLI tool needs to write logs/locks here
        - name: scratch-data
          mountPath: /var/lib/valkeydb-instance
      
      volumes:
      - name: scripts
        configMap:
          name: podverse-valkeydb-scripts
          defaultMode: 0755
      - name: scratch-data
        emptyDir: {}