# DANGER: This drops the database schema.
# Usage: kubectl apply -f k8s/alpha/ops/db-drop-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: ops-db-drop-everything
  namespace: podverse-alpha
spec:
  ttlSecondsAfterFinished: 60 # Auto-delete the job 60s after it finishes
  template:
    spec:
      containers:
      - name: psql
        image: postgres:18.1
        # Replicates: psql -U postgres -d postgres -c "DROP SCHEMA public CASCADE..."
        command: ["psql", "-h", "podverse-db", "-U", "postgres", "-d", "postgres", "-c", "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"]
        envFrom:
        - secretRef:
            name: podverse-db-secret
      restartPolicy: Never
