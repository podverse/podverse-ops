# Version: 3
# Child Application: Key-Value Database (Valkey/Redis)
# This application manages the caching layer for the Podverse ecosystem.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha-keyvaldb
  namespace: argocd
spec:
  project: podverse
  source:
    # Points to your git repository
    repoURL: https://github.com/podverse/podverse-ops.git
    targetRevision: feature/k3s02
    
    # Path to the valkey manifests (Deployment, Service, ConfigMap)
    path: k8s/alpha/keyvaldb

  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true