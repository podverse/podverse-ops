# Version: 3
# Child Application: Database
# This application manages the PostgreSQL StatefulSet and persistent storage.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha-db
  namespace: argocd
spec:
  project: podverse
  source:
    # Points to your git repository
    repoURL: https://github.com/podverse/podverse-ops.git
    targetRevision: feature/k3s02
    
    # Path to the database manifests (StatefulSet, Service, etc.)
    path: k8s/alpha/db

  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true