# Version: 3
# Child Application: API
# This application manages the core backend API for Podverse.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha-api
  namespace: argocd
spec:
  project: podverse
  source:
    # Points to your git repository
    repoURL: https://github.com/podverse/podverse-ops.git
    targetRevision: feature/k3s02
    
    # Path to the API manifests (Deployment, Service, ConfigMap)
    path: k8s/alpha/api

  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true