# Version: 3
# Child Application: Cron Jobs
# This application manages scheduled maintenance and data processing tasks.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha-cron
  namespace: argocd
spec:
  project: podverse
  source:
    # Points to your git repository
    repoURL: https://github.com/podverse/podverse-ops.git
    targetRevision: feature/k3s02
    
    # Path to the Cron manifests (CronJobs for reports, archiving, etc.)
    path: k8s/alpha/cron

  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true