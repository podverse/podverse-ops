# Version: 3 (HTTPS + HTTP/3 + TLS Options)
# This Ingress now listens on HTTPS (websecure).
# It routes API and Web traffic based on Host headers.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podverse-ingress
  namespace: podverse-alpha
  labels:
    app: podverse
    environment: alpha
  annotations:
    # 1. Switch Entrypoint to HTTPS
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    
    # 2. Enable TLS (This activates HTTP/2 automatically)
    traefik.ingress.kubernetes.io/router.tls: "true"
    
    # 3. Apply our Advanced TLS Options (from tls-options.yaml)
    # Format: <resource-name>@<provider namespace> (if referencing across namespaces, but here same ns)
    traefik.ingress.kubernetes.io/router.tls.options: podverse-secure-tls@kubernetescrd
    
    # 4. Cert-Manager (If you have it installed, uncomment this)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"

spec:
  # This section tells K8s which secret holds your SSL Certificate.
  # If you don't have Cert-Manager, you must create this secret manually.
  tls:
  - hosts:
    - api.alpha.podverse.podcastdj.com
    - alpha.podverse.podcastdj.com
    secretName: podverse-tls-cert

  rules:
  # Rule 1: API Subdomain
  - host: api.alpha.podverse.podcastdj.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: podverse-api
            port:
              number: 1234

  # Rule 2: Web (Frontend) Domain
  - host: alpha.podverse.podcastdj.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: podverse-web
            port:
              number: 3000
