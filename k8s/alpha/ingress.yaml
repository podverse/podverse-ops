# Version: 2 (Host-based Routing)
# This Ingress routes traffic based on the subdomain.
# api.alpha... -> API Service
# alpha...     -> Web Service

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podverse-ingress
  namespace: podverse-alpha
  labels:
    app: podverse
    environment: alpha
  annotations:
    # K3s uses Traefik by default. This ensures we listen on the standard web (HTTP) entrypoint.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  # Rule 1: API Subdomain
  - host: api.alpha.podverse.podcastdj.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: podverse-api
            port:
              number: 1234

  # Rule 2: Web (Frontend) Domain
  - host: alpha.podverse.podcastdj.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: podverse-web
            port:
              number: 3000
