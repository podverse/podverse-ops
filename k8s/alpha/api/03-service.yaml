# Version: 1
# This Service exposes the API internally on port 1234.
# The Ingress (created later) will point to this Service to expose it to the world.

apiVersion: v1
kind: Service
metadata:
  name: podverse-api
  namespace: podverse-alpha
  labels:
    app: podverse-api
    environment: alpha
spec:
  type: ClusterIP
  selector:
    app: podverse-api
  ports:
    - name: http
      port: 1234
      targetPort: 1234
      protocol: TCP
