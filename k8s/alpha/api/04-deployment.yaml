# Version: 2 (Added DB Secret Ref)
# The Deployment for the Podverse API.
# It connects to the Database and MQ using the environment variables defined in the ConfigMap/Secret.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-api
  namespace: podverse-alpha
  labels:
    app: podverse-api
    environment: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podverse-api
  template:
    metadata:
      labels:
        app: podverse-api
        environment: alpha
    spec:
      containers:
      - name: api
        # UPDATE THIS TAG to your desired version (e.g., v4.x.x)
        image: ghcr.io/podverse/podverse-api/podverse-api:latest
        command: ["npm", "start"]
        ports:
        - containerPort: 1234
          name: http
        
        # Load non-sensitive config
        envFrom:
        - configMapRef:
            name: podverse-api-config
        # Load API specific secrets (JWT, Mailer)
        - secretRef:
            name: podverse-api-secret
        # Load DB secrets (DB_READ_PASSWORD, etc.)
        - secretRef:
            name: podverse-db-secret
            
        # Basic health check
        readinessProbe:
          httpGet:
            path: /
            port: 1234
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 1234
          initialDelaySeconds: 30
          periodSeconds: 20
