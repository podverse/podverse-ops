# Version: 1
# The StatefulSet manages the Database Pod.
# It defines the storage, the image, the configuration arguments, and the startup scripts.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: podverse-db
  namespace: podverse-alpha
  labels:
    app: podverse-db
    environment: alpha
spec:
  serviceName: "podverse-db"
  replicas: 1
  selector:
    matchLabels:
      app: podverse-db
  template:
    metadata:
      labels:
        app: podverse-db
        environment: alpha
    spec:
      containers:
      - name: postgres
        image: postgres:18.1
        ports:
        - containerPort: 5432
          name: postgres
        
        # We inject the sensitive variables from the Secret we created in Step 2
        envFrom:
        - secretRef:
            name: podverse-db-secret
        
        # We translate the 'command' flags from docker-compose into 'args'.
        # Note: We do not set 'max_worker_processes' or 'max_parallel_workers' too high
        # as this is a shared home lab environment, but we kept your values here.
        args:
          - "-c"
          - "max_connections=100"
          - "-c"
          - "superuser_reserved_connections=5"
          - "-c"
          - "shared_buffers=256MB"
          - "-c"
          - "effective_cache_size=2GB"
          - "-c"
          - "maintenance_work_mem=256MB"
          - "-c"
          - "checkpoint_completion_target=0.7"
          - "-c"
          - "wal_buffers=8MB"
          - "-c"
          - "default_statistics_target=100"
          - "-c"
          - "random_page_cost=1.1"
          - "-c"
          - "effective_io_concurrency=200"
          - "-c"
          - "work_mem=5242kB"
          - "-c"
          - "min_wal_size=256MB"
          - "-c"
          - "max_wal_size=1GB"
          - "-c"
          - "max_worker_processes=2"
          - "-c"
          - "max_parallel_workers_per_gather=2"
          - "-c"
          - "max_parallel_workers=2"

        volumeMounts:
        # The Persistent Storage for the actual DB data
        - name: db-data
          mountPath: /var/lib/postgresql/data
        
        # We mount the scripts from the ConfigMap into the special directory
        # that the official Postgres image checks on startup.
        # This AUTOMATICALLY runs your create-user script and init-database SQL
        # when the database is first created.
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
      
      volumes:
      - name: init-scripts
        configMap:
          name: podverse-db-init-scripts

  # This section requests the physical storage from K3s (Local Path Provisioner).
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      # 'local-path' is the default storage class in K3s on NixOS/Proxmox usually.
      # If you haven't configured a specific one, this will store data on the node's disk.
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi # Adjust size as needed for your home lab
