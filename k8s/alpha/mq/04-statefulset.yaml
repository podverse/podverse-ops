# Version: 1
# The StatefulSet for ActiveMQ Artemis.
# We explicitly set the environment variables for the admin user/password.
# We verify readiness by checking if the console port is responding.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: podverse-mq
  namespace: podverse-alpha
  labels:
    app: podverse-mq
    environment: alpha
spec:
  serviceName: "podverse-mq"
  replicas: 1
  selector:
    matchLabels:
      app: podverse-mq
  template:
    metadata:
      labels:
        app: podverse-mq
        environment: alpha
    spec:
      containers:
      - name: artemis
        image: apache/activemq-artemis:2.37.0
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 8161
          name: console
        - containerPort: 61616
          name: core
        
        envFrom:
        - secretRef:
            name: podverse-mq-secret

        # Basic readiness probe to check if the broker is up
        readinessProbe:
          tcpSocket:
            port: 8161
          initialDelaySeconds: 10
          periodSeconds: 5

        volumeMounts:
        - name: mq-data
          mountPath: /var/lib/activemq-artemis

  volumeClaimTemplates:
  - metadata:
      name: mq-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi
