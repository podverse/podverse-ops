# Version: 1
# This Job acts as a "hook" to provision the queues once the broker is running.
# It mounts the script we defined in the ConfigMap (Step 5) and executes it.
# We use the same image as the broker so we have access to the 'artemis' CLI tool.

apiVersion: batch/v1
kind: Job
metadata:
  name: podverse-mq-provisioner
  namespace: podverse-alpha
  labels:
    app: podverse-mq
    component: provisioner
    environment: alpha
  annotations:
    # ArgoCD Hook: This ensures ArgoCD runs this AFTER deploying the StatefulSet.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    metadata:
      labels:
        app: podverse-mq-provisioner
    spec:
      restartPolicy: OnFailure
      containers:
      - name: provisioner
        image: apache/activemq-artemis:2.37.0
        command: ["/bin/bash", "/scripts/provision-queues.sh"]
        
        envFrom:
        - secretRef:
            name: podverse-mq-secret
        
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      
      volumes:
      - name: scripts
        configMap:
          name: podverse-mq-scripts
          defaultMode: 0755 # Ensures the script is executable
