# Source: Jenkinsfile.aux_workers_archive_all
# Schedule: 6 AM and 6 PM daily
apiVersion: batch/v1
kind: CronJob
metadata:
  name: worker-archive-all
  namespace: podverse-alpha
spec:
  schedule: "0 6,18 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: worker
            image: ghcr.io/podverse/podverse-workers/podverse-workers:latest
            command: ["npm", "run", "archive_all"]
            envFrom:
            - configMapRef:
                name: podverse-workers-config
            - secretRef:
                name: podverse-workers-secret
            volumeMounts:
            - name: firebase-config
              mountPath: /opt/config/firebase-key.json
              subPath: firebase-key.json
              readOnly: true
          volumes:
          - name: firebase-config
            secret:
              secretName: podverse-workers-firebase-secret
          restartPolicy: OnFailure
