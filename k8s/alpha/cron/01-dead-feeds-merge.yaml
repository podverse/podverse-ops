apiVersion: batch/v1
kind: CronJob
metadata:
  name: worker-dead-feeds-merge
  namespace: podverse-alpha
  labels:
    app: podverse-workers
    task: dead-feeds
spec:
  # Schedule: Run at 2am daily (Change this to match your Jenkins schedule)
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: worker
            image: ghcr.io/podverse/podverse-workers/podverse-workers:latest
            # The command from your Jenkinsfile:
            # npm run podcast_index_dead_feeds_flag_and_merge
            command: ["npm", "run", "podcast_index_dead_feeds_flag_and_merge"]
            
            # Re-use the same env/secrets as the main worker deployment
            envFrom:
            - configMapRef:
                name: podverse-workers-config
            - secretRef:
                name: podverse-workers-secret
            
            volumeMounts:
            - name: firebase-config
              mountPath: /opt/config/firebase-key.json
              subPath: firebase-key.json
              readOnly: true

          volumes:
          - name: firebase-config
            secret:
              secretName: podverse-workers-firebase-secret
          
          restartPolicy: OnFailure
