# Source: Jenkinsfile.aux_workers_mq_rss_run_live_item_listener
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-listener-live
  namespace: podverse-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-listener-live
  template:
    metadata:
      labels:
        app: worker-listener-live
    spec:
      containers:
      - name: worker
        image: ghcr.io/podverse/podverse-workers/podverse-workers:latest
        command: ["npm", "run", "mq_rss_run_live_item_listener"]
        envFrom:
        - configMapRef:
            name: podverse-workers-config
        - secretRef:
            name: podverse-workers-secret
        volumeMounts:
        - name: firebase-config
          mountPath: /opt/config/firebase-key.json
          subPath: firebase-key.json
          readOnly: true
      volumes:
      - name: firebase-config
        secret:
          secretName: podverse-workers-firebase-secret
