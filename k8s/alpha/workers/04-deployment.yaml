# Version: 1
# The Deployment for the Podverse Workers.
# Handles background tasks (RSS parsing, etc.).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-workers
  namespace: podverse-alpha
  labels:
    app: podverse-workers
    environment: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podverse-workers
  template:
    metadata:
      labels:
        app: podverse-workers
        environment: alpha
    spec:
      # Matches 'stop_grace_period: 5m' from Docker Compose
      terminationGracePeriodSeconds: 300
      
      containers:
      - name: workers
        # UPDATE THIS TAG to your desired version
        image: ghcr.io/podverse/podverse-workers/podverse-workers:latest
        
        envFrom:
        - configMapRef:
            name: podverse-workers-config
        - secretRef:
            name: podverse-workers-secret
        
        volumeMounts:
        # Mount the Firebase JSON key from the Secret
        - name: firebase-config
          mountPath: /opt/config/firebase-key.json
          subPath: firebase-key.json
          readOnly: true
        
        # Temporary storage for logs if the app writes to disk
        - name: logs
          mountPath: /opt/logs

      volumes:
      - name: firebase-config
        secret:
          secretName: podverse-workers-firebase-secret
      
      - name: logs
        emptyDir: {}
