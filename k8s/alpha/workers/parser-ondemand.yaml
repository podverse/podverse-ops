apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-parser-ondemand
  namespace: podverse-alpha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-parser-ondemand
  template:
    metadata:
      labels:
        app: worker-parser-ondemand
    spec:
      containers:
      - name: worker
        image: ghcr.io/podverse/podverse-workers/podverse-workers:latest
        command: ["npm", "run", "mq_rss_run_parser", "--", "-q", "rss-on-demand"]
        envFrom:
        - configMapRef:
            name: podverse-workers-config
        - secretRef:
            name: podverse-workers-secret
        volumeMounts:
        - name: firebase-config
          mountPath: /opt/config/firebase-key.json
          subPath: firebase-key.json
          readOnly: true
      volumes:
      - name: firebase-config
        secret:
          secretName: podverse-workers-firebase-secret
